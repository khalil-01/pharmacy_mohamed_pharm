<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صيدلية محمد فارم - تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20260525-perf">
</head>
<body>

<section id="loginPage" class="login-wrap">
  <div class="login-card">
    <h1 data-pharmacy-name>صيدلية محمد فارم</h1>
    <p>سجّل الدخول لمتابعة الفواتير، التحقق من الحوالات، والبحث السريع داخل بيانات الصيدلية.</p>

    <form id="loginForm" class="login-form">
      <div class="field">
        <label for="loginUsername">اسم المستخدم</label>
        <input id="loginUsername" name="username" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username">
      </div>

      <div class="field" style="margin-top:12px;">
        <label for="loginPassword">كلمة المرور</label>
        <input id="loginPassword" name="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password">
      </div>

      <p id="loginError" class="login-error hidden">اسم المستخدم أو كلمة المرور غير صحيحة.</p>
      <button type="submit" class="btn btn-primary" style="margin-top:16px;">دخول</button>
    </form>
  </div>
</section>

<button class="theme-toggle" id="themeToggle" type="button" title="تبديل الوضع">🌙</button>

<script defer src="assets/js/mock-data.js?v=20260525-perf"></script>
<script defer src="assets/js/app.js?v=20260525-perf"></script>
</body>
</html>
