<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صيدلية محمد فارم - صيانة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --bg: #f4f8ff;
      --card: #ffffff;
      --dark: #0f172a;
      --muted: #475569;
      --border: #bfdbfe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --dark: #f1f5f9;
        --muted: #94a3b8;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body {
      background:
        radial-gradient(circle at top right, rgba(96,165,250,.18), transparent 28%),
        radial-gradient(circle at bottom left, rgba(14,165,233,.12), transparent 25%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
      color: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .maintenance-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(29,78,216,.18);
      padding: 40px 32px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .maintenance-icon {
      font-size: 64px;
      margin-bottom: 16px;
    }
    .maintenance-card h1 {
      color: var(--primary);
      font-size: 28px;
      margin-bottom: 12px;
      font-weight: 800;
    }
    .maintenance-card p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 8px;
    }
    .spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-top: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="maintenance-card">
    <div class="maintenance-icon">🔧</div>
    <h1>الموقع تحت الصيانة</h1>
    <p>نقوم حالياً بتحديث النظام وتحسين الأداء.</p>
    <p>سيعود الموقع للعمل خلال دقائق قليلة.</p>
    <p style="margin-top: 16px; font-weight: 700; color: var(--primary);">صيدلية محمد فارم</p>
    <div class="spinner"></div>
  </div>
</body>
</html>
